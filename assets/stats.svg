<svg width="840" height="250" viewBox="0 0 840 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Cyber Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Cyan Bar Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Purple Bar Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Pink Bar Gradient -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Green Bar Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Drop Shadow / Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 800; font-size: 19px; fill: #00f2fe; letter-spacing: 1.5px; }
    .subtitle { font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; fill: #94a3b8; letter-spacing: 0.5px; }
    .metric-label { font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #e2e8f0; }
    .metric-val { font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 700; fill: #00f2fe; }
    .hud-text { font-family: 'Fira Code', monospace; font-size: 12px; fill: #64748b; }
    .badge-text { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 600; fill: #ffffff; }
  </style>

  <!-- Main Container -->
  <rect x="2" y="2" width="836" height="246" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Cyber Grid Pattern (Subtle) -->
  <g opacity="0.08" stroke="#00f2fe" stroke-width="0.8">
    <line x1="30" y1="0" x2="30" y2="250" />
    <line x1="150" y1="0" x2="150" y2="250" />
    <line x1="270" y1="0" x2="270" y2="250" />
    <line x1="390" y1="0" x2="390" y2="250" />
    <line x1="510" y1="0" x2="510" y2="250" />
    <line x1="630" y1="0" x2="630" y2="250" />
    <line x1="750" y1="0" x2="750" y2="250" />
    <line x1="0" y1="40" x2="840" y2="40" />
    <line x1="0" y1="90" x2="840" y2="90" />
    <line x1="0" y1="140" x2="840" y2="140" />
    <line x1="0" y1="190" x2="840" y2="190" />
  </g>

  <!-- Left Side: Identity & Telemetry -->
  <g transform="translate(30, 30)">
    <!-- Header -->
    <text x="0" y="20" class="title">⚡ ARK4NG3L // NEURAL TELEMETRY</text>
    <text x="0" y="42" class="subtitle">&gt; AI SYSTEMS ARCHITECT &amp; VIBE CODER</text>

    <!-- Mini Badges Row -->
    <g transform="translate(0, 58)">
      <rect x="0" y="0" width="105" height="24" rx="6" fill="#8b5cf6" fill-opacity="0.25" stroke="#8b5cf6" stroke-width="1" />
      <text x="52" y="16" text-anchor="middle" class="badge-text" fill="#c084fc">FLOW: 100%</text>

      <rect x="115" y="0" width="115" height="24" rx="6" fill="#00f2fe" fill-opacity="0.2" stroke="#00f2fe" stroke-width="1" />
      <text x="172" y="16" text-anchor="middle" class="badge-text" fill="#38bdf8">REPOS: 28+</text>

      <rect x="240" y="0" width="105" height="24" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
      <text x="292" y="16" text-anchor="middle" class="badge-text" fill="#34d399">STATUS: ACTIVE</text>
    </g>

    <!-- Info Matrix -->
    <g transform="translate(0, 106)">
      <text x="0" y="16" class="hud-text">CORE ENGINE :</text>
      <text x="110" y="16" class="metric-label" fill="#38bdf8">Local Uncensored LLMs + Swarms</text>

      <text x="0" y="38" class="hud-text">AGENTIC RAG :</text>
      <text x="110" y="38" class="metric-label" fill="#c084fc">Graph-RAG &amp; Vector Pipelines</text>

      <text x="0" y="60" class="hud-text">CYBER FOCUS :</text>
      <text x="110" y="60" class="metric-label" fill="#34d399">Tactical OSINT &amp; Cryptography</text>

      <text x="0" y="82" class="hud-text">WORKFLOW    :</text>
      <text x="110" y="82" class="metric-label" fill="#f43f5e">Shipping at Speed of Thought</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="430" y1="30" x2="430" y2="220" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Right Side: Proficiency & Skill Bars -->
  <g transform="translate(455, 30)">
    <text x="0" y="20" class="title" fill="#8b5cf6">🚀 DOMAIN CAPABILITIES</text>

    <!-- Skill 1: Vibe Coding & Rapid Prototyping -->
    <g transform="translate(0, 42)">
      <text x="0" y="12" class="metric-label">⚡ Vibe Coding &amp; Flow Orchestration</text>
      <text x="350" y="12" text-anchor="end" class="metric-val">100%</text>
      <rect x="0" y="18" width="350" height="7" rx="3.5" fill="#1e293b" />
      <rect x="0" y="18" width="350" height="7" rx="3.5" fill="url(#cyanGrad)" filter="url(#cyanGlow)" />
    </g>

    <!-- Skill 2: Autonomous Multi-Agent Swarms -->
    <g transform="translate(0, 77)">
      <text x="0" y="12" class="metric-label">🤖 Autonomous Multi-Agent Swarms</text>
      <text x="350" y="12" text-anchor="end" class="metric-val" fill="#c084fc">98%</text>
      <rect x="0" y="18" width="350" height="7" rx="3.5" fill="#1e293b" />
      <rect x="0" y="18" width="343" height="7" rx="3.5" fill="url(#purpleGrad)" />
    </g>

    <!-- Skill 3: OSINT, Threat Intel & Recon -->
    <g transform="translate(0, 112)">
      <text x="0" y="12" class="metric-label">🛡️ Tactical OSINT &amp; Cyber Recon</text>
      <text x="350" y="12" text-anchor="end" class="metric-val" fill="#34d399">95%</text>
      <rect x="0" y="18" width="350" height="7" rx="3.5" fill="#1e293b" />
      <rect x="0" y="18" width="332" height="7" rx="3.5" fill="url(#greenGrad)" />
    </g>

    <!-- Skill 4: Cryptography & Reversing -->
    <g transform="translate(0, 147)">
      <text x="0" y="12" class="metric-label">🔐 Cryptography &amp; Reverse Engineering</text>
      <text x="350" y="12" text-anchor="end" class="metric-val" fill="#f43f5e">92%</text>
      <rect x="0" y="18" width="350" height="7" rx="3.5" fill="#1e293b" />
      <rect x="0" y="18" width="322" height="7" rx="3.5" fill="url(#pinkGrad)" />
    </g>
  </g>
</svg>
