<svg width="850" height="190" viewBox="0 0 850 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f" />
      <stop offset="100%" stop-color="#080b12" />
    </linearGradient>

    <!-- Subtle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="ambientGlow" cx="0%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
  </style>

  <!-- Card Background with glow & subtle border -->
  <rect x="1" y="1" width="848" height="188" rx="12" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.2" />
  <rect x="1" y="1" width="848" height="188" rx="12" fill="url(#ambientGlow)" />

  <!-- Top Tag / Pill Badge -->
  <g transform="translate(36, 26)">
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
    <circle cx="12" cy="12" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="16" class="mono" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">VIBE CODER // AI FLOW</text>
  </g>

  <!-- Main Name / Title -->
  <text x="36" y="90" class="sans" font-size="34" font-weight="800" fill="url(#nameGrad)" letter-spacing="-0.8">Ark _Ang3l</text>
  <text x="245" y="90" class="mono" font-size="15" font-weight="400" fill="#64748b">/ ark4ng3l</text>

  <!-- Subtitle / Manifesto -->
  <text x="36" y="122" class="sans" font-size="14.5" font-weight="400" fill="#cbd5e1" letter-spacing="-0.2">
    Engineering autonomous multi-agent swarms, Graph-RAG architectures &amp; tactical OSINT.
  </text>

  <!-- Status / Metadata Badges -->
  <g transform="translate(36, 146)">
    <text x="0" y="14" class="mono" font-size="12" fill="#38bdf8">⚡ Flow: 100%</text>
    <text x="110" y="14" class="mono" font-size="12" fill="#475569">•</text>
    <text x="130" y="14" class="mono" font-size="12" fill="#a5b4fc">🧠 Local LLMs &amp; Agents</text>
    <text x="300" y="14" class="mono" font-size="12" fill="#475569">•</text>
    <text x="320" y="14" class="mono" font-size="12" fill="#34d399">🛡️ Cybersecurity &amp; Recon</text>
    <text x="500" y="14" class="mono" font-size="12" fill="#475569">•</text>
    <text x="520" y="14" class="mono" font-size="12" fill="#94a3b8">📍 Cyberspace</text>
  </g>
</svg>
